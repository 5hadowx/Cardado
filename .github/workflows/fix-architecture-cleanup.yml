name: Fix architecture cleanup compile issues

on:
  push:
    branches: [architecture-cleanup]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: architecture-cleanup
      - name: Apply compile fixes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin b8d36125fa4c2b6fa923bed3d4f437044c7ce15c

          python3 - <<'PY'
          from pathlib import Path

          gm = Path('Assets/1. Scripts/a. Game Manager/CardadoGameManager.cs')
          s = gm.read_text()
          if 'private CardadoCardActionManager cardActionManager;' not in s:
              s = s.replace('    private int handTurnsCompleted;\n', '    private int handTurnsCompleted;\n    private CardadoCardActionManager cardActionManager;\n', 1)
          s = s.replace('        PendingCardActionCard = null;\n        CardadoPlayerState player = players[CurrentHandPlayerIndex];', '        CardadoPlayerState player = players[CurrentHandPlayerIndex];', 1)
          if 'private bool IsValidPlayerIndex(int playerIndex)' not in s:
              s = s.replace('    private void ValidatePlayerIndex(int playerIndex) { if (playerIndex < 0 || playerIndex >= players.Count) throw new ArgumentOutOfRangeException(nameof(playerIndex)); }', '    private bool IsValidPlayerIndex(int playerIndex) => playerIndex >= 0 && playerIndex < players.Count;\n    private void ValidatePlayerIndex(int playerIndex) { if (!IsValidPlayerIndex(playerIndex)) throw new ArgumentOutOfRangeException(nameof(playerIndex)); }')
          gm.write_text(s)

          war = Path('Assets/1. Scripts/a. Game Manager/CardadoWarManager.cs')
          s = war.read_text()
          marker = '    public int GetPendingArtistResult(int index)\n'
          if 'GetJokerTargetForDevelopment' not in s:
              insertion = '    public bool IsWarInProgressForDevelopment() => WarInProgress;\n\n    public CardadoWarContext.Participant GetJokerTargetForDevelopment() => pendingJokerTarget;\n\n'
              s = s.replace(marker, insertion + marker, 1)
          war.write_text(s)

          overlay = Path('Assets/1. Scripts/a. Game Manager/CardadoWarCardActionDevelopmentOverlay.cs')
          s = overlay.read_text()
          s = s.replace('!warManager.IsWarInProgressForDevelopment()', '!warManager.IsWarInProgressForDevelopment()')
          overlay.write_text(s)
          PY

          git checkout b8d36125fa4c2b6fa923bed3d4f437044c7ce15c -- 'Assets/1. Scripts/a. Game Manager/CardadoWarCardRules.cs'
          git add .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix architecture cleanup compile errors'
          git push origin architecture-cleanup
