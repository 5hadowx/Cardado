name: Fix War Manager lifecycle

on:
  workflow_dispatch:
  push:
    branches: [architecture-cleanup]

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Fix War Manager lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture-cleanup
          fetch-depth: 0

      - name: Patch WarManager lifecycle
        shell: python
        run: |
          from pathlib import Path
          path = Path('Assets/1. Scripts/a. Game Manager/CardadoWarManager.cs')
          text = path.read_text(encoding='utf-8')
          old = '''    private void OnEnable()\n    {\n        if (gameManager != null) gameManager.PhaseChanged += OnPhaseChanged;\n    }'''
          new = '''    private void OnEnable()\n    {\n        if (gameManager == null) gameManager = FindFirstObjectByType<CardadoGameManager>();\n        if (gameManager != null) gameManager.PhaseChanged += OnPhaseChanged;\n    }'''
          if old not in text:
              raise SystemExit('Expected OnEnable block not found')
          text = text.replace(old, new, 1)
          old = '''    private void Start()\n    {\n        if (gameManager != null && gameManager.Phase == CardadoGamePhase.WarResolution)\n            BeginWarPhase();\n    }'''
          new = '''    private void Start()\n    {\n        EnsureWarPhaseInitialized();\n    }'''
          if old not in text:
              raise SystemExit('Expected Start block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit source change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-war-manager-lifecycle.yml
          git add "Assets/1. Scripts/a. Game Manager/CardadoWarManager.cs"
          git commit -m "Fix War Manager lifecycle"
          git push origin architecture-cleanup
