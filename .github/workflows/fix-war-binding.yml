name: Fix War binding

on:
  push:
    branches: [architecture-cleanup]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix War manager binding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture-cleanup
          fetch-depth: 0

      - name: Patch War manager binding
        shell: python
        run: |
          from pathlib import Path

          gm = Path('Assets/1. Scripts/a. Game Manager/CardadoGameManager.cs')
          text = gm.read_text(encoding='utf-8')
          old = '''        warManager = GetComponent<CardadoWarManager>();
        if (warManager == null) warManager = gameObject.AddComponent<CardadoWarManager>();
        if (GetComponent<CardadoCardActionDevelopmentOverlay>() == null) gameObject.AddComponent<CardadoCardActionDevelopmentOverlay>();'''
          new = '''        warManager = GetComponent<CardadoWarManager>();
        if (warManager == null) warManager = gameObject.AddComponent<CardadoWarManager>();
        warManager.InitializeFromGameManager(this);
        if (GetComponent<CardadoCardActionDevelopmentOverlay>() == null) gameObject.AddComponent<CardadoCardActionDevelopmentOverlay>();'''
          if old not in text:
              raise SystemExit('Expected GameManager War bootstrap block not found')
          gm.write_text(text.replace(old, new, 1), encoding='utf-8')

          war = Path('Assets/1. Scripts/a. Game Manager/CardadoWarManager.cs')
          text = war.read_text(encoding='utf-8')
          old = '''    public void EnsureWarPhaseInitialized()
    {
        if (gameManager == null) gameManager = FindFirstObjectByType<CardadoGameManager>();
        if (gameManager == null || gameManager.Phase != CardadoGamePhase.WarResolution) return;
        if (warPhaseInitialized) return;
        BeginWarPhase();
    }
'''
          new = '''    public void InitializeFromGameManager(CardadoGameManager manager)
    {
        if (manager == null) return;
        if (gameManager != null && gameManager != manager)
            gameManager.PhaseChanged -= OnPhaseChanged;
        gameManager = manager;
        gameManager.PhaseChanged -= OnPhaseChanged;
        gameManager.PhaseChanged += OnPhaseChanged;
        EnsureWarPhaseInitialized();
    }

    public void EnsureWarPhaseInitialized()
    {
        if (gameManager == null) return;
        if (gameManager.Phase != CardadoGamePhase.WarResolution) return;
        if (warPhaseInitialized) return;
        BeginWarPhase();
    }
'''
          if old not in text:
              raise SystemExit('Expected War ensure block not found')
          text = text.replace(old, new, 1)

          old = '''    private void Awake()
    {
        if (gameManager == null) gameManager = FindFirstObjectByType<CardadoGameManager>();
    }

    private void OnEnable()
    {
        if (gameManager == null) gameManager = FindFirstObjectByType<CardadoGameManager>();
        if (gameManager != null) gameManager.PhaseChanged += OnPhaseChanged;
    }'''
          new = '''    private void Awake()
    {
        if (gameManager == null) gameManager = FindFirstObjectByType<CardadoGameManager>();
    }

    private void OnEnable()
    {
        if (gameManager != null) gameManager.PhaseChanged += OnPhaseChanged;
    }'''
          if old not in text:
              raise SystemExit('Expected War lifecycle block not found')
          text = text.replace(old, new, 1)

          old = '''    private void OnPhaseChanged(CardadoGamePhase phase)
    {
        if (phase == CardadoGamePhase.WarResolution) BeginWarPhase();
    }'''
          new = '''    private void OnPhaseChanged(CardadoGamePhase phase)
    {
        if (phase == CardadoGamePhase.WarResolution) EnsureWarPhaseInitialized();
    }'''
          if old not in text:
              raise SystemExit('Expected War phase callback not found')
          text = text.replace(old, new, 1)
          war.write_text(text, encoding='utf-8')

      - name: Commit source fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-war-binding.yml
          git add "Assets/1. Scripts/a. Game Manager/CardadoGameManager.cs" "Assets/1. Scripts/a. Game Manager/CardadoWarManager.cs"
          git commit -m "Fix War manager binding"
          git push origin architecture-cleanup
