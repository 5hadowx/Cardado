name: One-time War bootstrap

on:
  push:
    branches:
      - architecture-cleanup

permissions:
  contents: write

jobs:
  bootstrap:
    if: "!contains(github.event.head_commit.message, 'Bootstrap War manager in GameManager')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture-cleanup
      - name: Patch GameManager and remove workflow
        shell: python
        run: |
          from pathlib import Path
          path = Path('Assets/1. Scripts/a. Game Manager/CardadoGameManager.cs')
          text = path.read_text(encoding='utf-8')
          old = '''        cardActionManager = GetComponent<CardadoCardActionManager>();\n        if (cardActionManager == null) cardActionManager = gameObject.AddComponent<CardadoCardActionManager>();\n        if (GetComponent<CardadoCardActionDevelopmentOverlay>() == null) gameObject.AddComponent<CardadoCardActionDevelopmentOverlay>();'''
          new = '''        cardActionManager = GetComponent<CardadoCardActionManager>();\n        if (cardActionManager == null) cardActionManager = gameObject.AddComponent<CardadoCardActionManager>();\n        if (GetComponent<CardadoWarManager>() == null) gameObject.AddComponent<CardadoWarManager>();\n        if (GetComponent<CardadoCardActionDevelopmentOverlay>() == null) gameObject.AddComponent<CardadoCardActionDevelopmentOverlay>();'''
          if old not in text:
              raise SystemExit('Expected GameManager Awake block was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/one-time-war-bootstrap.yml').unlink()
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Assets/1. Scripts/a. Game Manager/CardadoGameManager.cs" ".github/workflows/one-time-war-bootstrap.yml"
          git commit -m "Bootstrap War manager in GameManager"
          git push origin architecture-cleanup
